# tmux config for the kendle console. It runs on a socket of its own per workspace, so
# nothing here affects any other tmux use.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
# one dim bottom line: a hint, and a highlighted key guide while Ctrl-b is active
set -g status on
set -g status-style "fg=colour243,bg=default"
set -g status-left ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right-length 90
set -g status-right "#{?client_prefix,#[fg=colour16 bg=colour214 bold] Ctrl-b active: h sidebar · ← sidebar · r restart sidebar · d close #[default],Ctrl-q: sidebar ⇄ session }"
set -g allow-rename off
set -g automatic-rename off
# a session that exits stays readable on screen until you select something else
set -g remain-on-exit on
set -g pane-border-style "fg=colour237"
set -g pane-active-border-style "fg=colour244"

# prefix h: back to the sidebar
bind h select-pane -t kendle:console.0
bind C-h select-pane -t kendle:console.0   # same, when Ctrl is still held

# Ctrl-q alone: switch between the sidebar and the session on the right.
# Unused by macOS, iTerm and Claude Code (checked 2026-09-10); macOS desktop shortcuts stay untouched.
bind -n C-q if -F "#{&&:#{==:#{window_name},console},#{==:#{pane_index},0}}" "select-pane -t kendle:console.1" "select-pane -t kendle:console.0"

# the sidebar keeps the width the user chose (< > or dragging the border; stored by core.py)

# prefix r: restart the sidebar (after a crash or an update)
bind r respawn-pane -k -t kendle:console.0
